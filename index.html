<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Project - Oviri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --accent: #ffe81f; --bg: #000; }
        body { background-color: var(--bg); color: #fff; scroll-behavior: smooth; transition: 0.8s; font-family: 'Arial', sans-serif; }
        
        /* TEMAS */
        body.sith { --accent: #ff0000; box-shadow: inset 0 0 150px #600; }
        body.jedi { --accent: #00a2ff; box-shadow: inset 0 0 150px #004; }
        body.classic { --accent: #ffe81f; }

        .navbar { border-bottom: 2px solid var(--accent); background: #000; padding: 10px 20px; }
        .text-starwars { color: var(--accent); font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }
        
        /* TRIÁNGULO MULTIMEDIA */
        .grid-triangulo { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px; }
        .fila-unica { width: 40%; min-width: 300px; }
        .fila-doble { display: flex; gap: 20px; width: 85%; justify-content: center; flex-wrap: wrap; }

        .media-box { 
            width: 100%; aspect-ratio: 16/9; border: 2px solid var(--accent); 
            border-radius: 12px; overflow: hidden; background: #111; cursor: pointer; transition: 0.4s;
        }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        
        /* MODO PROGRAMADOR */
        #modoProg { 
            color: #00ff00; font-family: monospace; font-size: 0.75rem; 
            position: fixed; bottom: 20px; left: 20px; 
            background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00ff00; z-index: 1000;
        }

        .btn-salir { color: #ff4444; border: none; background: none; font-size: 0.8rem; cursor: pointer; opacity: 0.5; }
    </style>
</head>

            </div>
        </div>
    </nav>
